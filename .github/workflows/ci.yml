name: Verify production changes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: proxy/package-lock.json
      - name: Check frontend syntax
        run: |
          node --check app.js
          node --check sw.js
      - name: Install locked proxy dependencies
        working-directory: proxy
        run: npm ci
      - name: Check proxy syntax and high-severity dependencies
        working-directory: proxy
        run: |
          node --check server.js
          npm audit --audit-level=high
