services:
  - type: web
    name: sanitaryflow-ai-proxy
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: CORS_ORIGINS
        value: https://sanitaryflow-erp.web.app,https://sanitaryflow-erp.firebaseapp.com,http://localhost:5173
      - key: REQUIRE_FIREBASE_AUTH
        value: "false"
      - key: FIREBASE_PROJECT_ID
        value: sanitaryflow-erp
