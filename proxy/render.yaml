services:
  - type: web
    name: sanitaryflow-ai-proxy
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PRICE_OVERRIDE_PASSWORD_HASH
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_KEY_BASE64
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: CORS_ORIGINS
        value: https://sanitaryflow-erp.web.app,https://sanitaryflow-erp.firebaseapp.com
      - key: REQUIRE_FIREBASE_AUTH
        value: "true"
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: sanitaryflow-erp
