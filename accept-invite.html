<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accept Staff Invite - SaviaSmart ERP</title>
    <link rel="preconnect" href="https://www.gstatic.com" />
    <link rel="stylesheet" href="./styles.css?v=20260808e" />
    <meta name="theme-color" content="#101114" />
  </head>
  <body>
    <div class="invite-gate">
      <form class="invite-panel" id="acceptInviteForm" novalidate>
        <div class="invite-heading">
          <p class="eyebrow">Staff invitation</p>
          <h1>SaviaSmart ERP</h1>
          <p class="auth-copy" id="acceptInviteIntro">Loading invite&hellip;</p>
        </div>

        <!-- Filled from /api/staff/invite-preview. Without it this page is a
             bare email+password form, which reads as ordinary self-signup and
             gives a staff member no way to tell who invited them or in what
             role. Stays hidden if the preview is unreachable. -->
        <div class="auth-why" id="inviteContextBox" hidden>
          <strong id="inviteContextHeading"></strong>
          <p class="auth-copy" id="inviteContextText"></p>
        </div>

        <div class="invite-fields" id="acceptInviteFormFields" hidden>
          <!-- Sales are attributed to this name. It is collected here, from the
               person themselves, because the owner no longer maintains a list of
               cashier names for the till to pick from. -->
          <label>
            <span>Your full name</span>
            <input id="inviteFullName" type="text" autocomplete="name" maxlength="80" required />
            <span class="field-error" id="inviteFullNameError"></span>
          </label>
          <label>
            <span>Email</span>
            <input id="inviteEmail" type="email" autocomplete="email" required />
            <span class="field-error" id="inviteEmailError"></span>
          </label>
          <label>
            <span>Password</span>
            <input id="invitePassword" type="password" autocomplete="new-password" minlength="6" required />
            <span class="field-error" id="invitePasswordError"></span>
          </label>
          <label id="inviteConfirmPasswordRow">
            <span>Confirm password</span>
            <input id="inviteConfirmPassword" type="password" autocomplete="new-password" minlength="6" />
            <span class="field-error" id="inviteConfirmPasswordError"></span>
          </label>
          <span class="field-error" id="acceptInviteError"></span>
          <button class="primary-button full-width" id="acceptInviteSubmitButton" type="submit">Accept Invite</button>
        </div>

        <!-- Shown when the account exists but its email is not verified yet.
             A brand-new account is never verified at the moment it is created,
             so this step is the normal path for a first-time staff member,
             not an error state. -->
        <div class="invite-fields" id="inviteVerifySection" hidden>
          <div class="auth-why">
            <strong id="inviteVerifyHeading">Verify your email to continue</strong>
            <p class="auth-copy" id="inviteVerifyText">
              We sent a verification link to your email. Open it, tap the link, then come back here and press Continue.
            </p>
          </div>
          <span class="field-error" id="inviteVerifyError"></span>
          <button class="primary-button full-width" id="inviteVerifyContinueButton" type="button">
            I have verified &mdash; Continue
          </button>
          <button class="ghost-button full-width" id="inviteResendVerificationButton" type="button">
            Resend verification email
          </button>
        </div>
      </form>
    </div>
    <script type="module" src="./accept-invite.js?v=20260731b"></script>
  </body>
</html>
